services:
  db:
    image: postgres:16-alpine
    container_name: product-inventory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: product_inventory_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "viet@123456"
    ports:
      - "5433:5432"
    volumes:
      - product_inventory_pgdata:/var/lib/postgresql/data

volumes:
  product_inventory_pgdata:
    driver: local